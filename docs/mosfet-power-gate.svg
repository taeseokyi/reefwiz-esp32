<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 940" width="1060" height="940"
     font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <!-- reefwiz-esp32: HC-05 전원 게이팅 회로 — P채널 하이사이드 스위치.
       왜 필요한가: 이 HC-05(펌웨어 3.0-20170601)는 AT+LINK 가 항상 FAIL 이라 대상 전환의
       마지막 단계가 '전원 콜드 부팅'뿐이다(실측: 재바인드 후 60초 대기해도 미연결 /
       전원 재투입 시 약 5초에 연결). 헤더 EN 은 이 보드에서 KEY 라 전원을 못 끊는다.
       밝은 배경을 명시해 GitHub 라이트/다크 어느 테마에서도 같은 대비로 보이게 한다. -->
  <rect x="0" y="0" width="1060" height="940" fill="#fcfcf9"/>

  <text x="530" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1b2430">
    HC-05 전원 게이팅 — P채널 하이사이드 스위치
  </text>
  <text x="530" y="62" text-anchor="middle" font-size="13" fill="#5a6673">
    GPIO14 = HIGH → HC-05 전원 ON  ·  LOW → OFF   |   ★5V 라인을 끊는다(GND 는 절대 끊지 않음)
  </text>

  <!-- ══════════ 전원 레일 ══════════ -->
  <!-- +5V 레일 -->
  <line x1="120" y1="120" x2="1030" y2="120" stroke="#c0392b" stroke-width="3"/>
  <text x="100" y="125" text-anchor="end" font-size="14" font-weight="700" fill="#c0392b">+5V</text>
  <text x="140" y="110" font-size="11" fill="#8c2f24">ESP32 5V 핀</text>

  <!-- GND 레일 -->
  <line x1="120" y1="800" x2="1030" y2="800" stroke="#333c46" stroke-width="3"/>
  <text x="100" y="805" text-anchor="end" font-size="14" font-weight="700" fill="#333c46">GND</text>
  <text x="140" y="820" font-size="11" fill="#5a6673">ESP32 GND — 공통 그라운드(끊지 않는다)</text>

  <!-- ══════════ ESP32 블록 ══════════ -->
  <rect x="60" y="380" width="150" height="120" rx="10" fill="#eaf1fb" stroke="#2b4c7e" stroke-width="2"/>
  <text x="135" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">ESP32-S3</text>
  <text x="135" y="430" text-anchor="middle" font-size="12" fill="#2b4c7e">GPIO14</text>
  <text x="135" y="450" text-anchor="middle" font-size="10" fill="#5a6673">BT_POWER_PIN</text>
  <text x="135" y="472" text-anchor="middle" font-size="10" fill="#5a6673">HIGH = 전원 ON</text>
  <!-- GPIO14 출력선 -->
  <line x1="210" y1="440" x2="300" y2="440" stroke="#2b4c7e" stroke-width="2.5"/>

  <!-- ══════════ R2 (1k, 게이트 직렬) ══════════ -->
  <rect x="300" y="428" width="56" height="24" fill="#fff" stroke="#1b2430" stroke-width="2"/>
  <text x="328" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">R2 1k</text>
  <line x1="356" y1="440" x2="430" y2="440" stroke="#1b2430" stroke-width="2.5"/>

  <!-- 노드 A (Q2 게이트 노드) -->
  <circle cx="430" cy="440" r="4.5" fill="#1b2430"/>
  <text x="430" y="418" text-anchor="middle" font-size="10" fill="#5a6673">노드 A</text>

  <!-- ══════════ R3 (10k 풀다운) ══════════ -->
  <line x1="430" y1="440" x2="430" y2="560" stroke="#1b2430" stroke-width="2.5"/>
  <rect x="402" y="560" width="56" height="24" fill="#fff" stroke="#1b2430" stroke-width="2"/>
  <text x="430" y="577" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">R3 10k</text>
  <line x1="430" y1="584" x2="430" y2="800" stroke="#1b2430" stroke-width="2.5"/>
  <text x="446" y="620" font-size="10.5" fill="#8c2f24">부팅 중 부동 방지</text>
  <text x="446" y="636" font-size="10.5" fill="#8c2f24">(기본 OFF 확정)</text>

  <!-- ══════════ Q2 : 2N7000 N채널 ══════════ -->
  <!-- 게이트 리드 -->
  <line x1="430" y1="440" x2="520" y2="440" stroke="#1b2430" stroke-width="2.5"/>
  <!-- 게이트 수직 바 -->
  <line x1="524" y1="405" x2="524" y2="475" stroke="#1b2430" stroke-width="3"/>
  <!-- 채널 바 -->
  <line x1="540" y1="405" x2="540" y2="475" stroke="#1b2430" stroke-width="3"/>
  <!-- 드레인(위) -->
  <line x1="540" y1="415" x2="590" y2="415" stroke="#1b2430" stroke-width="2.5"/>
  <line x1="590" y1="415" x2="590" y2="300" stroke="#1b2430" stroke-width="2.5"/>
  <!-- 소스(아래) -->
  <line x1="540" y1="465" x2="590" y2="465" stroke="#1b2430" stroke-width="2.5"/>
  <line x1="590" y1="465" x2="590" y2="800" stroke="#1b2430" stroke-width="2.5"/>
  <!-- 화살표(N채널: 안쪽으로) -->
  <polygon points="540,440 552,434 552,446" fill="#1b2430"/>
  <!-- 라벨 -->
  <text x="556" y="502" font-size="13" font-weight="700" fill="#1b2430">Q2  2N7000</text>
  <text x="556" y="519" font-size="10.5" fill="#5a6673">N채널 (TO-92) · 논리레벨</text>
  <text x="600" y="410" font-size="10.5" font-weight="700" fill="#2b4c7e">③D</text>
  <text x="600" y="480" font-size="10.5" font-weight="700" fill="#2b4c7e">①S</text>
  <text x="496" y="396" font-size="10.5" font-weight="700" fill="#2b4c7e">②G</text>

  <!-- ══════════ 노드 B (Q1 게이트 = Q2 드레인 = R1) ══════════ -->
  <circle cx="590" cy="300" r="4.5" fill="#1b2430"/>
  <text x="600" y="292" font-size="10" fill="#5a6673">노드 B (Q1 게이트)</text>
  <line x1="590" y1="300" x2="700" y2="300" stroke="#1b2430" stroke-width="2.5"/>

  <!-- ══════════ R1 (10k 풀업) ══════════ -->
  <line x1="590" y1="300" x2="590" y2="230" stroke="#1b2430" stroke-width="2.5"/>
  <rect x="562" y="180" width="56" height="24" fill="#fff" stroke="#1b2430" stroke-width="2"/>
  <text x="590" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">R1 10k</text>
  <line x1="590" y1="180" x2="590" y2="120" stroke="#1b2430" stroke-width="2.5"/>
  <circle cx="590" cy="120" r="4.5" fill="#c0392b"/>
  <text x="606" y="232" font-size="10.5" fill="#8c2f24">게이트를 5V 로 올려</text>
  <text x="606" y="248" font-size="10.5" fill="#8c2f24">기본 OFF 로 둔다</text>

  <!-- ══════════ Q1 : IRF9540N P채널 ══════════ -->
  <!-- 게이트 수직 바 -->
  <line x1="704" y1="265" x2="704" y2="335" stroke="#1b2430" stroke-width="3"/>
  <!-- 채널 바 -->
  <line x1="720" y1="265" x2="720" y2="335" stroke="#1b2430" stroke-width="3"/>
  <!-- 소스(위) → +5V -->
  <line x1="720" y1="275" x2="790" y2="275" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="790" y1="275" x2="790" y2="120" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="790" cy="120" r="4.5" fill="#c0392b"/>
  <!-- 드레인(아래) → HC-05 VCC -->
  <line x1="720" y1="325" x2="790" y2="325" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="790" y1="325" x2="790" y2="430" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 화살표(P채널: 바깥으로) -->
  <polygon points="720,300 708,294 708,306" fill="#1b2430"/>
  <!-- 라벨 -->
  <text x="736" y="252" font-size="13" font-weight="700" fill="#1b2430">Q1  IRF9540N</text>
  <text x="736" y="236" font-size="10.5" fill="#5a6673">P채널 (TO-220) · 게이트 LOW → 도통</text>
  <text x="800" y="270" font-size="10.5" font-weight="700" fill="#c0392b">③S</text>
  <text x="800" y="345" font-size="10.5" font-weight="700" fill="#c0392b">②D</text>
  <text x="676" y="256" font-size="10.5" font-weight="700" fill="#2b4c7e">①G</text>

  <!-- 스위칭 전원 노드 -->
  <circle cx="790" cy="430" r="4.5" fill="#c0392b"/>
  <text x="672" y="422" font-size="11" font-weight="700" fill="#c0392b">스위칭된 5V</text>

  <!-- ══════════ C1 / C2 — 둘 다 HC-05 VCC ↔ GND 에 병렬 ══════════ -->
  <!-- 점선 묶음: 두 커패시터가 같은 노드(VCC-GND)에 붙는다는 것을 시각화 -->
  <rect x="655" y="452" width="255" height="185" rx="8" fill="#eef7f0" stroke="#1b7a3d"
        stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="770" y="474" text-anchor="middle" font-size="11" font-weight="700" fill="#1b7a3d">
    C1 · C2 — HC-05 VCC ↔ GND 에 병렬
  </text>
  <text x="770" y="490" text-anchor="middle" font-size="9.5" fill="#2f6b45">
    (새 핀이 아니다 · 모듈에 최대한 가깝게)
  </text>

  <!-- C1 전해 100uF -->
  <line x1="790" y1="430" x2="700" y2="430" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="700" y1="430" x2="700" y2="545" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="682" y1="545" x2="718" y2="545" stroke="#1b2430" stroke-width="3.5"/>
  <path d="M 682 561 A 18 12 0 0 0 718 561" fill="none" stroke="#1b2430" stroke-width="3.5"/>
  <line x1="700" y1="561" x2="700" y2="800" stroke="#1b2430" stroke-width="2.5"/>
  <text x="636" y="541" font-size="11" font-weight="700" fill="#1b2430">C1</text>
  <text x="620" y="557" font-size="10" fill="#5a6673">100µF</text>
  <text x="726" y="539" font-size="11" font-weight="700" fill="#c0392b">+</text>
  <text x="620" y="573" font-size="9.5" fill="#8c2f24">★극성</text>

  <!-- C2 세라믹 0.1uF -->
  <line x1="790" y1="430" x2="866" y2="430" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="866" y1="430" x2="866" y2="545" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="848" y1="545" x2="884" y2="545" stroke="#1b2430" stroke-width="3.5"/>
  <line x1="848" y1="561" x2="884" y2="561" stroke="#1b2430" stroke-width="3.5"/>
  <line x1="866" y1="561" x2="866" y2="800" stroke="#1b2430" stroke-width="2.5"/>
  <text x="892" y="541" font-size="11" font-weight="700" fill="#1b2430">C2</text>
  <text x="892" y="557" font-size="10" fill="#5a6673">0.1µF</text>
  <text x="892" y="573" font-size="9.5" fill="#5a6673">무극성</text>

  <!-- VCC 노드(분기점) 강조 -->
  <circle cx="700" cy="430" r="4.5" fill="#c0392b"/>
  <circle cx="866" cy="430" r="4.5" fill="#c0392b"/>

  <!-- HC-05 VCC 로 가는 선 -->
  <line x1="790" y1="430" x2="936" y2="430" stroke="#c0392b" stroke-width="2.5"/>

  <!-- ══════════ HC-05 모듈 박스 ══════════ -->
  <rect x="936" y="330" width="110" height="200" rx="10" fill="#fdf1e3" stroke="#a8631b" stroke-width="2"/>
  <text x="991" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">HC-05</text>
  <text x="991" y="376" text-anchor="middle" font-size="10.5" fill="#5a6673">ZS-040 캐리어</text>
  <text x="950" y="424" font-size="11" font-weight="700" fill="#c0392b">VCC</text>
  <text x="950" y="452" font-size="10" fill="#5a6673">≈40mA</text>
  <text x="950" y="470" font-size="10" fill="#5a6673">사양 3.6~6V</text>
  <text x="950" y="494" font-size="10" fill="#a8631b">TX·RX·EN·STATE</text>
  <text x="950" y="508" font-size="10" fill="#a8631b">→ ESP32 직결</text>
  <!-- HC-05 GND -->
  <line x1="991" y1="530" x2="991" y2="800" stroke="#1b2430" stroke-width="2.5"/>
  <circle cx="991" cy="800" r="4.5" fill="#333c46"/>
  <text x="1000" y="560" font-size="10.5" font-weight="700" fill="#1b2430">GND</text>

  <!-- ══════════ 동작 표 ══════════ -->
  <rect x="60" y="640" width="330" height="130" rx="8" fill="#f4f7fb" stroke="#93a3b5" stroke-width="1.4"/>
  <text x="76" y="664" font-size="12.5" font-weight="700" fill="#1b2430">동작</text>

  <line x1="76" y1="674" x2="374" y2="674" stroke="#93a3b5" stroke-width="1"/>
  <text x="84"  y="692" font-size="11" font-weight="700" fill="#2b4c7e">GPIO14</text>
  <text x="152" y="692" font-size="11" font-weight="700" fill="#1b2430">Q2</text>
  <text x="196" y="692" font-size="11" font-weight="700" fill="#1b2430">Q1 게이트</text>
  <text x="286" y="692" font-size="11" font-weight="700" fill="#1b2430">HC-05</text>
  <line x1="76" y1="700" x2="374" y2="700" stroke="#dde4ec" stroke-width="1"/>

  <text x="84"  y="722" font-size="11" fill="#1b7a3d" font-weight="700">HIGH</text>
  <text x="152" y="722" font-size="11" fill="#333c46">도통</text>
  <text x="196" y="722" font-size="11" fill="#333c46">0V (Vgs −5V)</text>
  <text x="286" y="722" font-size="11" font-weight="700" fill="#1b7a3d">전원 ON</text>

  <text x="84"  y="748" font-size="11" fill="#c0392b" font-weight="700">LOW</text>
  <text x="152" y="748" font-size="11" fill="#333c46">차단</text>
  <text x="196" y="748" font-size="11" fill="#333c46">5V (Vgs 0V)</text>
  <text x="286" y="748" font-size="11" font-weight="700" fill="#c0392b">전원 OFF</text>

  <!-- ══════════ 핀 배열 박스 ══════════ -->
  <rect x="60" y="150" width="330" height="215" rx="8" fill="#fff8ec" stroke="#a8631b" stroke-width="1.4"/>
  <text x="76" y="174" font-size="12.5" font-weight="700" fill="#8c2f24">★핀 배열 (두 부품의 순서가 다르다)</text>

  <text x="76" y="200" font-size="11.5" font-weight="700" fill="#1b2430">Q1  IRF9540N — TO-220</text>
  <text x="88" y="218" font-size="11" fill="#333c46">금속 탭 뒤 · 글자면 앞, 좌→우:</text>
  <text x="88" y="236" font-size="12" font-weight="700" fill="#2b4c7e">① Gate  ② Drain  ③ Source</text>
  <text x="88" y="253" font-size="10.5" fill="#5a6673">탭은 Drain 과 도통 — 다른 부품에 닿지 않게</text>

  <text x="76" y="282" font-size="11.5" font-weight="700" fill="#1b2430">Q2  2N7000 — TO-92</text>
  <text x="88" y="300" font-size="11" fill="#333c46">평평한 면 앞 · 핀 아래로, 좌→우:</text>
  <text x="88" y="318" font-size="12" font-weight="700" fill="#2b4c7e">① Source  ② Gate  ③ Drain</text>

  <text x="76" y="345" font-size="10.5" fill="#8c2f24">★대체품(AO3401A·2N7002 등 SOT-23)은 순서가 또</text>
  <text x="76" y="359" font-size="10.5" fill="#8c2f24">  다르다 — 데이터시트를 반드시 확인할 것</text>

  <!-- ══════════ 하단 주석 ══════════ -->
  <rect x="60" y="838" width="970" height="58" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
  <text x="76" y="860" font-size="11.5" font-weight="700" fill="#8c2f24">★왜 하이사이드(5V 차단)인가 — 로우사이드(GND 차단) 모듈은 쓸 수 없다</text>
  <text x="76" y="882" font-size="10.5" fill="#8c2f24">IRF520·IRF540·D4184 같은 흔한 모듈은 GND 를 끊는데, HC-05 는 TX/RX 가 ESP32 에 물려 있어 신호선으로 역급전돼 완전히 꺼지지 않는다(반쯤 켜진 좀비).</text>
</svg>
