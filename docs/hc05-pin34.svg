<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560"
     font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <!-- reefwiz-esp32: HC-05 PIN34(KEY/PIO11) 위치. 헤더에 KEY 가 없어서 어디에 납땜하는지가
       실장에서 가장 자주 틀리는 지점이다. 방향 기준을 그림 안에 명시한다 — "오른쪽 맨 위"는
       보드를 어떻게 놓았는지에 따라 달라지므로 그것 없이는 쓸모가 없다.
       배경을 밝게 고정해 GitHub 라이트/다크 어느 테마에서도 같은 대비로 보이게 한다. -->
  <rect x="0" y="0" width="940" height="560" fill="#fcfcf9"/>

  <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1b2430">
    HC-05 PIN34 (KEY / PIO11) 위치 — 코어 모듈 오른쪽 맨 위 핀
  </text>
  <text x="470" y="64" text-anchor="middle" font-size="13" fill="#5a6673">
    ★방향 기준: 부품면(금속 캔·안테나가 보이는 면)을 위로, 6핀 헤더를 아래로 두었을 때
  </text>

  <!-- ── ZS-040 캐리어 보드 ── -->
  <rect x="120" y="96" width="300" height="404" rx="8" fill="#1f4b6e" stroke="#12314a" stroke-width="2"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#cfe3f2">
    ZS-040 캐리어 (위에서 본 모습)
  </text>

  <!-- 안테나 — 위쪽 끝. 방향을 눈으로 확인하는 기준점이다 -->
  <polyline points="150,146 168,136 186,146 204,136 222,146 240,136 258,146"
            fill="none" stroke="#e8c56a" stroke-width="3"/>
  <text x="410" y="163" text-anchor="end" font-size="11" fill="#cfe3f2">안테나 패턴 — 이쪽이 위</text>

  <!-- ── 코어 모듈 (BC417 34패드) ── -->
  <rect x="150" y="168" width="240" height="232" rx="4" fill="#2e7d4f" stroke="#1d5a37" stroke-width="2"/>
  <rect x="196" y="196" width="148" height="120" rx="3" fill="#b9bfc4" stroke="#7d858c" stroke-width="1.5"/>
  <text x="270" y="262" text-anchor="middle" font-size="11" fill="#41525f">CSR BC417 (금속 캔)</text>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#dff0e5">코어 모듈 — 34패드 캐슬레이션</text>

  <!-- 왼쪽 패드 열 -->
  <rect x="142" y="180" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="200" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="220" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="240" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="260" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="280" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="300" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="320" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="340" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="360" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="142" y="380" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>

  <!-- 오른쪽 패드 열 — 맨 위가 PIN34 -->
  <rect x="382" y="180" width="16" height="11" rx="2" fill="#e74c3c" stroke="#8c2f24" stroke-width="2"/>
  <rect x="382" y="200" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="220" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="240" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="260" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="280" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="300" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="320" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="340" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="360" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>
  <rect x="382" y="380" width="16" height="11" rx="2" fill="#d9c37a" stroke="#8a7430"/>

  <!-- PIN34 지시선 -->
  <line x1="600" y1="186" x2="404" y2="186" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="404,186 416,181 416,191" fill="#c0392b"/>
  <circle cx="390" cy="186" r="15" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="610" y="182" font-size="15" font-weight="700" fill="#c0392b">PIN34 (PIO11) = KEY</text>
  <text x="610" y="201" font-size="12" fill="#8c2f24">오른쪽 열의 맨 위 패드 — 여기가 KEY 다</text>
  <text x="610" y="218" font-size="12" fill="#8c2f24">→ GPIO14 (10kΩ 풀다운 필수)</text>

  <!-- ── 온보드 버튼 — 같은 네트의 다른 접점 ── -->
  <rect x="330" y="424" width="56" height="40" rx="4" fill="#e6e9ec" stroke="#68727d" stroke-width="1.5"/>
  <text x="358" y="449" text-anchor="middle" font-size="10" fill="#41525f">버튼</text>
  <line x1="600" y1="444" x2="400" y2="444" stroke="#1e7d4f" stroke-width="2.5"/>
  <polygon points="400,444 412,439 412,449" fill="#1e7d4f"/>
  <text x="610" y="440" font-size="13" font-weight="700" fill="#155c3a">온보드 버튼 (VCC → PIN34)</text>
  <text x="610" y="458" font-size="12" fill="#155c3a">버튼의 <tspan font-weight="700">VCC 아닌 쪽</tspan> 패드도 같은 네트다</text>
  <text x="610" y="475" font-size="12" fill="#155c3a">— 패드가 커서 납땜은 이쪽이 쉽다</text>

  <!-- ── 6핀 헤더 (아래쪽) ── -->
  <rect x="150" y="472" width="240" height="22" rx="3" fill="#2b3a45" stroke="#0f1a22" stroke-width="1.5"/>
  <circle cx="176" cy="483" r="5" fill="#c8ad5f"/>
  <circle cx="211" cy="483" r="5" fill="#c8ad5f"/>
  <circle cx="246" cy="483" r="5" fill="#c8ad5f"/>
  <circle cx="281" cy="483" r="5" fill="#c8ad5f"/>
  <circle cx="316" cy="483" r="5" fill="#c8ad5f"/>
  <circle cx="351" cy="483" r="5" fill="#c8ad5f"/>
  <text x="270" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">
    6핀 헤더 — VCC · GND · TXD · RXD · EN · STATE
  </text>
  <text x="270" y="533" text-anchor="middle" font-size="11" fill="#c0392b">
    ★이 헤더에 KEY 는 없다 (헤더의 EN 은 KEY 가 아니다)
  </text>

  <!-- ── 주의 블록 ── -->
  <text x="610" y="264" font-size="12" font-weight="700" fill="#1b2430">납땜 지점은 둘 중 하나 (같은 네트)</text>
  <text x="610" y="285" font-size="11.5" fill="#333c46">① 코어 모듈 오른쪽 맨 위 패드(PIN34) — 위 표시 지점</text>
  <text x="610" y="303" font-size="11.5" fill="#333c46">② 온보드 버튼의 VCC 아닌 쪽 패드 — 아래 표시 지점</text>

  <text x="610" y="336" font-size="12" font-weight="700" fill="#1b2430">확인 방법 (배선 전)</text>
  <text x="610" y="357" font-size="11.5" fill="#333c46">멀티미터 저항/도통 모드로 <tspan font-weight="700">버튼을 누른 상태</tspan>에서</text>
  <text x="610" y="374" font-size="11.5" fill="#333c46">VCC 와 도통되는 쪽이 PIN34 다 — 버튼이 VCC→PIN34</text>
  <text x="610" y="391" font-size="11.5" fill="#333c46">를 잇는 구조라 이 검사로 확정된다.</text>

  <text x="610" y="510" font-size="11.5" fill="#c0392b">★부팅 중 KEY 가 뜨면 모듈이 AT 모드로 부팅해</text>
  <text x="610" y="527" font-size="11.5" fill="#c0392b">　장비에 붙지 않는다 → 10kΩ 풀다운은 필수.</text>
</svg>
